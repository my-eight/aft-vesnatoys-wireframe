<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личные данные — прототип «Весна»</title>
  <link rel="stylesheet" href="личный-кабинет.css">
  <script src="личный-кабинет.js" defer></script>
</head>
<body data-view="profile">
  <header class="placeholder">хедер</header>
  <main class="frame">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <span>Главная страница</span>
      <span aria-hidden="true">/</span>
      <a href="Текущие заказы.html">Личный кабинет</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Личные данные</span>
    </nav>
    <h1>Личные данные</h1>
    <div class="account-layout">

      <form class="panel stack" id="profile-form">
        <section class="profile-group" aria-label="Имя покупателя">
          <div class="fields">
            <label class="field">Имя<input type="text" name="first-name" value="Анна" autocomplete="given-name" required></label>
            <label class="field">Отчество<input type="text" name="middle-name" value="Сергеевна" autocomplete="additional-name"></label>
            <label class="field">Фамилия<input type="text" name="last-name" value="Иванова" autocomplete="family-name" required></label>
          </div>
        </section>
        <section class="profile-group" aria-label="Контакты и пароль">
          <div class="fields">
            <label class="field">Телефон<input type="tel" name="phone" value="+7 (900) 000-00-00" autocomplete="tel"></label>
            <label class="field">Электронная почта<input type="email" name="email" value="anna@example.com" autocomplete="email" required></label>
            <label class="field">Новый пароль<input type="password" name="password" value="" autocomplete="new-password" minlength="6"></label>
            <label class="field">Подтверждение пароля
              <input type="password" name="confirmation" autocomplete="new-password">
              <small>Не менее 6 символов при смене пароля</small>
            </label>
          </div>
        </section>
        <details class="profile-group">
          <summary>Адрес доставки</summary>
          <div class="fields sub-actions">
            <label class="field">Город<input type="text" name="city" value="Киров" autocomplete="address-level2"></label>
            <label class="field">Улица, дом, квартира<input type="text" name="address" value="" autocomplete="street-address"></label>
          </div>
        </details>
        <details class="profile-group">
          <summary>Данные организации</summary>
          <div class="fields sub-actions">
            <label class="field">Название организации<input type="text" name="company" value="" autocomplete="organization"></label>
            <label class="field">ИНН<input type="text" name="inn" value="" inputmode="numeric"></label>
          </div>
        </details>
        <div class="actions">
          <button class="button button--primary" type="submit">Сохранить</button>
          <button class="button" type="reset">Сбросить</button>
        </div>
        <p class="form-feedback" id="profile-feedback" role="status"></p>
      </form>
      <nav class="account-nav" aria-label="Личный кабинет">
        <a href="Личные данные.html" aria-current="page">Личные данные</a>
        <a href="Текущие заказы.html">Текущие заказы</a>
        <a href="История заказов.html">История заказов</a>
        <button type="button" data-order-action="logout">Выйти</button>
      </nav>
    </div>
  </main>
  <footer class="placeholder">футер</footer>

  <dialog id="order-dialog" aria-labelledby="dialog-title">
    <form class="stack" id="order-action-form">
      <h2 id="dialog-title"></h2>
      <p id="dialog-description"></p>
      <label class="field" id="dialog-message" hidden>Комментарий для менеджера
        <textarea name="message" rows="3"></textarea>
      </label>
      <div class="actions">
        <button class="button button--primary" type="submit" id="dialog-submit"></button>
        <button class="button" type="button" id="dialog-close">Закрыть</button>
      </div>
    </form>
  </dialog>
</body>
</html>
